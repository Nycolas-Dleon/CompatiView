{% extends 'base.html' %}
{% block link_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">{% endblock %}

{% block body %}

<form method="POST">

    <label for="username">Usuário</label>
    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <label for="password">Senha</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <button type="submit">Cadastrar</button>

</form>

{% endblock %}
