{% extends 'base.html' %}
{% block link_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/selection.css') }}">{% endblock %}

{% block body %}

<div class="container-geral">
    <form action="" method="POST">

    {% for categoria in components.keys() %}
        {% if categoria != 'cpu_sockets' %}

            <h2 class="nome-categoria">{{ nomes[categoria] }}</h2>
                <div class="containers-components">
                    <div class='listagem-components'>
                    {% for component in components[categoria].keys() %}
                        <input type="radio" id="{{ component }}" name="{{ categoria }}" value="{{ component}}">
                        <label for="{{ component }}">{{ component }}</label>
                    {% endfor %}
                    </div>
                    <div class="btns">
                        <input class="submit-btn" type="submit" value="Selecionar">
                        <input class="reset-btn" type="reset" value="Limpar">
                    </div>
                </div>
        {% endif %}
    {% endfor %}
    </form>
</div>

{% endblock %}
